
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - RK BlogSphere</title>
<meta name="description" content="RK BlogSphere account and author dashboard.">
<link rel="stylesheet" href="style.css">
<style>
.dashboard-page{
max-width:1100px;
margin:40px auto;
padding:20px;
}
.dashboard-panel{
padding:20px;
border-radius:18px;
}
.dashboard-heading{
margin-bottom:25px;
}
</style>
</head>
<body>

<header class="topbar">
<a class="brand" href="index.html">
<img src="rk-blogspheere-logo.png"
alt="RK BlogSphere"
class="rkb-logo-image rkb-header-logo">
</a>

<nav>
<a href="index.html">Home</a>
<a href="write.html">Write</a>
<a href="dashboard.html">Dashboard</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

<div id="authArea"></div>
</header>

<main class="dashboard-page">

<div class="sectionhead dashboard-heading">
<h1>Dashboard</h1>
<span>Account & Administration</span>
</div>

<div id="dashboardContent" class="dashboard-panel">

  <div id="dashboardWelcome">
    <h2>Welcome to RK BlogSphere</h2>
    <p>Please sign in to access your dashboard.</p>
    <button type="button" onclick="BLOGSPHERE.openLogin()">Sign In</button>
  </div>

  <div id="writerArea" hidden>
    <section class="dashboard-section">
      <h2>Write Article</h2>
      <div id="writePrompt"></div>
      <div id="writeForm"></div>
    </section>

    <section class="dashboard-section">
      <h2>My Articles</h2>
      <div id="myPosts"></div>
    </section>
  </div>

  <div id="adminArea" hidden>
    <section class="dashboard-section">
      <h2>Category Management</h2>
      <form id="categoryForm">
        <input type="text" id="categoryName" placeholder="Category name" required>
        <button type="submit">Add Category</button>
      </form>
      <div id="adminCategories"></div>
    </section>
  </div>

  <div id="superAdminArea" hidden>
    <section class="dashboard-section">
      <h2>User Management</h2>
      <div id="allUsers"></div>
    </section>
  </div>

</div>

</main>

<footer>
<p>© <span id="year"></span> RK BlogSphere</p>
</footer>

<div id="modal" class="modal" hidden>
<div class="modalcard">
<button id="closeModal" class="close">×</button>

<div class="rkb-logo-frame">
<img src="rk-blogspheere-logo.png"
class="rkb-logo-image rkb-auth-logo"
alt="RK BlogSphere">
</div>

<div id="modalContent"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
